<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vault-api &middot; merchant churn risk</title>
<style>
  :root {
    --ink: #16202e; --muted: #4a5568; --faint: #6b7280;
    --line: #d8dee8; --bg: #f7f9fc; --card: #ffffff;
    --low: #2f6b4f; --medium: #c0803a; --high: #a8372f;
    --up: #a8372f; --down: #2f6b4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--faint); font-size: .85rem; margin: 0 0 1.5rem; }
  form { display: flex; gap: .5rem; margin-bottom: .6rem; flex-wrap: wrap; }
  .narrow { flex: 0 1 15rem; }
  .note { margin: 0 0 1.5rem; }
  input {
    flex: 1; padding: .6rem .7rem; border: 1px solid var(--line);
    border-radius: 6px; font: inherit; font-family: ui-monospace, monospace;
    font-size: .82rem; background: var(--card); color: var(--ink);
  }
  button {
    padding: .6rem 1.1rem; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--ink); color: #fff; font: inherit; font-weight: 500;
  }
  button:disabled { opacity: .5; cursor: default; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 1.25rem; margin-bottom: 1rem;
  }
  .score-row { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .score { font-size: 2.75rem; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
  .band {
    font-size: .72rem; font-weight: 700; letter-spacing: .09em;
    padding: .3rem .6rem; border-radius: 4px; color: #fff;
  }
  .band.LOW { background: var(--low); }
  .band.MEDIUM { background: var(--medium); }
  .band.HIGH { background: var(--high); }
  .verdict { color: var(--muted); font-size: .9rem; }
  .meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 1rem; position: relative; }
  .meter-fill { height: 100%; border-radius: 3px; background: var(--ink); }
  .meter-mark { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--faint); }
  .meter-labels { display: flex; justify-content: space-between; font-size: .7rem; color: var(--faint); margin-top: .35rem; }
  h2 { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em;
       color: var(--faint); margin: 0 0 .75rem; font-weight: 600; }
  .factor { display: flex; align-items: center; gap: .6rem; padding: .45rem 0;
            border-bottom: 1px solid var(--line); }
  .factor:last-child { border-bottom: 0; }
  .arrow { font-weight: 700; width: 1rem; text-align: center; }
  .arrow.increases_risk { color: var(--up); }
  .arrow.decreases_risk { color: var(--down); }
  .fname { font-family: ui-monospace, monospace; font-size: .82rem; }
  .fdir { color: var(--faint); font-size: .78rem; margin-left: auto; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1.25rem; margin: 0; }
  dt { color: var(--faint); font-size: .82rem; }
  dd { margin: 0; font-family: ui-monospace, monospace; font-size: .82rem; }
  .msg { padding: .8rem 1rem; border-radius: 6px; font-size: .88rem; }
  .msg.error { background: #fdf0ee; color: #8a2b24; border: 1px solid #f0d2cd; }
  .hidden { display: none; }
  footer { color: var(--faint); font-size: .74rem; margin-top: 1.5rem; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8edf4; --muted: #a8b3c4; --faint: #8b96a8;
            --line: #2a3340; --bg: #11161d; --card: #181f28;
            --low: #4e9b76; --medium: #d9a05b; --high: #d1655a;
            --up: #d1655a; --down: #4e9b76; }
    button { background: #2f6bb3; }
    .msg.error { background: #2a1a18; border-color: #4a2a25; color: #e8a79f; }
  }
</style>
</head>
<body>
<main>
  <h1>Merchant churn risk</h1>
  <p class="sub">
    Scores are derived server-side from the payment ledger. The client sends no
    features.
  </p>

  <form id="lookup">
    <input id="merchant" name="merchant" placeholder="merchant UUID"
           autocomplete="off" spellcheck="false" required>
    <input id="as-of" name="as-of" placeholder="as of (optional, e.g. 2026-04-26)"
           autocomplete="off" spellcheck="false" class="narrow">
    <button type="submit">Score</button>
  </form>
  <p class="sub note">
    A merchant is scored only if they attempted a payment in the 60 days before
    <em>as of</em>. Leave it blank to use the end of the ledger.
  </p>

  <div id="error" class="msg error hidden"></div>

  <section id="result" class="hidden">
    <div class="card">
      <div class="score-row">
        <span class="score" id="score">—</span>
        <span class="band" id="band">—</span>
        <span class="verdict" id="verdict"></span>
      </div>
      <div class="meter">
        <div class="meter-fill" id="meter-fill"></div>
        <div class="meter-mark" id="meter-mark" title="decision threshold"></div>
      </div>
      <div class="meter-labels"><span>0.0</span><span>churn score</span><span>1.0</span></div>
    </div>

    <div class="card">
      <h2>Top contributing factors</h2>
      <div id="factors"></div>
    </div>

    <div class="card">
      <h2>Merchant</h2>
      <dl id="merchant-detail"></dl>
    </div>
  </section>

  <footer id="footer"></footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const form = $("lookup");
const params = new URLSearchParams(location.search);

const DIRECTION_LABEL = {
  increases_risk: "increases risk",
  decreases_risk: "lowers risk",
};
const ARROW = { increases_risk: "▲", decreases_risk: "▼" };

// The refusals are distinct situations and the wording has to say which.
const REASON_TEXT = {
  no_recent_activity:
    "No payment attempt in the 60 days before this date, so the merchant is " +
    "outside the population the model was trained on. Try an earlier “as of” date.",
  no_payments: "This merchant has never attempted a payment.",
  tenure_lt_90d: "This merchant has less than 90 days of tenure.",
};

function showError(message) {
  $("error").textContent = message;
  $("error").classList.remove("hidden");
  $("result").classList.add("hidden");
}

function renderFactors(factors) {
  $("factors").replaceChildren(...factors.map((factor) => {
    const row = document.createElement("div");
    row.className = "factor";

    const arrow = document.createElement("span");
    arrow.className = `arrow ${factor.direction}`;
    arrow.textContent = ARROW[factor.direction] ?? "";

    const name = document.createElement("span");
    name.className = "fname";
    name.textContent = factor.feature;

    const dir = document.createElement("span");
    dir.className = "fdir";
    dir.textContent = DIRECTION_LABEL[factor.direction] ?? factor.direction;

    row.append(arrow, name, dir);
    return row;
  }));
}

function renderDetail(merchant) {
  const entries = [
    ["merchant_id", merchant.merchant_id],
    ["joined", merchant.joined_at.slice(0, 10)],
    ["industry", merchant.industry ?? "—"],
  ];
  $("merchant-detail").replaceChildren(...entries.flatMap(([key, value]) => {
    const dt = document.createElement("dt");
    dt.textContent = key;
    const dd = document.createElement("dd");
    dd.textContent = value;
    return [dt, dd];
  }));
}

async function score(merchantId, asOf) {
  $("error").classList.add("hidden");
  const query = asOf ? `?as_of=${encodeURIComponent(asOf)}` : "";
  const risk = await fetch(`/merchants/${merchantId}/churn-risk${query}`);
  if (risk.status === 404) return showError("No merchant with that id.");
  if (risk.status === 409) {
    const body = await risk.json();
    return showError(REASON_TEXT[body?.detail?.reason] ?? "This merchant cannot be scored.");
  }
  if (risk.status === 503) return showError("The churn model is not loaded.");
  if (!risk.ok) return showError(`Request failed (${risk.status}).`);

  const data = await risk.json();
  $("score").textContent = data.churn_score.toFixed(3);
  $("band").textContent = data.risk_band;
  $("band").className = `band ${data.risk_band}`;
  $("verdict").textContent = data.predicted_churn
    ? "predicted to stop transacting in the next 60 days"
    : "predicted to keep transacting";
  $("meter-fill").style.width = `${Math.round(data.churn_score * 100)}%`;
  renderFactors(data.top_factors);

  const merchant = await fetch(`/merchants/${merchantId}`);
  if (merchant.ok) renderDetail(await merchant.json());

  $("footer").textContent =
    `model ${data.model_version} · scored as at ${data.snapshot_at}`;
  $("result").classList.remove("hidden");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    await score($("merchant").value.trim(), $("as-of").value.trim());
  } catch (err) {
    showError(`Could not reach the API: ${err.message}`);
  } finally {
    button.disabled = false;
  }
});

// ?merchant=<uuid>&as_of=<timestamp> scores on load, so the report screenshots
// are reproducible from a URL and pinned to the exemplar's own snapshot.
const preset = params.get("merchant");
if (preset) {
  $("merchant").value = preset;
  $("as-of").value = params.get("as_of") ?? "";
  form.requestSubmit();
}
</script>
</body>
</html>
